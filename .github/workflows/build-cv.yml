name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'CV.tex'
      - 'assets/**'
      - 'Makefile'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: CV.tex
          latexmk_use_xelatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: CV.pdf
          path: CV.pdf
